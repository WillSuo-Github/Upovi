name: macOS validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      public_topic:
        description: Optional synthetic topic published from an independent test Mac
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Select newest installed Xcode
        run: |
          python3 - <<'PY'
          import glob,plistlib,re,subprocess
          choices=[]
          for app in glob.glob('/Applications/Xcode*.app'):
              with open(app+'/Contents/Info.plist','rb') as handle:
                  version=plistlib.load(handle).get('CFBundleShortVersionString','0')
              choices.append((tuple(map(int,re.findall(r'\d+',version))),app))
          version,app=max(choices)
          assert version >= (16,), 'Swift 6 requires Xcode 16 or newer'
          subprocess.run(['sudo','xcode-select','--switch',app+'/Contents/Developer'],check=True)
          PY
          swift --version
      - name: Unit and recovery tests
        run: >-
          xcodebuild -project Upovi.xcodeproj -scheme Upovi
          -destination 'platform=macOS' -derivedDataPath .build/XcodeDerivedData
          -resultBundlePath .build/xcode-tests.xcresult test
      - name: Independent automatic discovery regression
        run: python3 script/test_automatic_discovery.py
      - name: Legacy private exchange regression
        run: python3 script/test_dht_exchange.py
      - name: Compile acceptance tools
        run: |
          swiftc script/acceptance/native_ui.swift -o .build/native-ui-acceptance
          python3 -m py_compile script/acceptance/soak.py
      - name: Verify administrator helper refuses unprivileged execution
        run: |
          swift build --product UpoviInstaller
          UPOVI_BIN_DIR="$(swift build --show-bin-path)"
          set +e
          "$UPOVI_BIN_DIR/UpoviInstaller" /dev/null > .build/helper-denial.log 2>&1
          UPOVI_HELPER_STATUS=$?
          set -e
          cat .build/helper-denial.log
          test "$UPOVI_HELPER_STATUS" -eq 1
          /usr/bin/grep -F 'Administrator authorization is required' .build/helper-denial.log
      - name: Verify Store helper refuses unprivileged execution
        run: |
          swift build --product UpoviStoreInstaller
          UPOVI_BIN_DIR="$(swift build --show-bin-path)"
          set +e
          "$UPOVI_BIN_DIR/UpoviStoreInstaller" /dev/null /dev/null > .build/store-helper-denial.log 2>&1
          UPOVI_HELPER_STATUS=$?
          set -e
          test "$UPOVI_HELPER_STATUS" -eq 1
          /usr/bin/grep -F 'Administrator authorization is required' .build/store-helper-denial.log
      - name: Build native bundle
        run: |
          CONFIGURATION=release UPOVI_STAGE_ONLY=1 ./script/package_release.sh
          test "$(dist/Upovi.app/Contents/MacOS/UpoviStoreBridge version)" = "7.0.0"
      - name: Read synthetic report from independent publisher
        if: github.event_name == 'workflow_dispatch' && inputs.public_topic != ''
        env:
          UPOVI_PUBLIC_TOPIC: ${{ inputs.public_topic }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          topic=os.environ['UPOVI_PUBLIC_TOPIC']
          assert re.fullmatch(r'app\.upovi\.synthetic\.[a-z0-9.-]{1,100}',topic)
          binary=subprocess.check_output(['swift','build','--show-bin-path'],text=True).strip()+'/UpoviPeer'
          subprocess.run([binary,'discover','--bundle',topic,'--team','SYNTHETIC','--require-report','--evidence-file','.build/cross-host-reader.json'],check=True,timeout=180)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.runner }}
          path: |
            .build/automatic-discovery-evidence.json
            .build/cross-host-reader.json
            .build/xcode-tests.xcresult
          if-no-files-found: ignore
